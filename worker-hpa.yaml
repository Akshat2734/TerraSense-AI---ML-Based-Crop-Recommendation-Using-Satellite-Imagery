apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-scaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrasense-worker
  minReplicas: 1
  maxReplicas: 4 # Spin up to 3 additional instances
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80 # 🌟 Trigger the scale when CPU hits 80%