events {
    worker_connections 1024;
}

http {
    # Define your FastAPI backend (the Waiter)
    upstream fastapi_cluster {
        server api:8000;
    }

    server {
        listen 80;
        server_name terrasense.local;

        # 1. Standard API Traffic (REST)
        location / {
            proxy_pass http://fastapi_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. 🌟 Explicit WebSocket Upgrade Route
        location /api/v1/ws {
            proxy_pass http://fastapi_cluster;
            proxy_http_version 1.1;
            
            # These two headers are what actually "upgrade" the connection to a WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_read_timeout 86400; # Keep the WebSocket open
        }
    }
}