services:
  # 1. The Official PostGIS Storage Node
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: terrasense-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=terrasense
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=terrasense_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrasense -d terrasense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. PgBouncer (Connection Pooling)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: terrasense-pgbouncer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6432:6432"
    environment:
      - DATABASE_URL=postgres://terrasense:secretpassword@db:5432/terrasense_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256

  # 3. Message Broker & Cache
  rabbitmq:
    image: rabbitmq:3-management
    container_name: terrasense-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:alpine
    container_name: terrasense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 4. FastAPI Server
  api:
    build: .
    container_name: terrasense-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      db:
        condition: service_started
      pgbouncer:
        condition: service_started
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
      # Reads bypass the queue and go directly to the database
      - DATABASE_READ_URL=postgresql://terrasense:secretpassword@db:5432/terrasense_db
      # Writes queue up safely inside PgBouncer
      - DATABASE_WRITE_URL=postgresql://terrasense:secretpassword@pgbouncer:6432/terrasense_db
    volumes:
      - ./gee_keys:/root/.config/earthengine:ro

  # 5. Celery ML Worker
  worker:
    build: .
    container_name: terrasense-worker
    command: celery -A services.worker.celery_app worker --pool=solo --loglevel=info
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
      # Heavy ML writes queue up safely inside PgBouncer
      - DATABASE_WRITE_URL=postgresql://terrasense:secretpassword@pgbouncer:6432/terrasense_db
    volumes:
      - ./gee_keys:/root/.config/earthengine:ro

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      # It looks in the current root directory (./) for the file
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: terrasense-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Default login password
    depends_on:
      - prometheus

  # Add this to the bottom of your docker-compose.yml
  nginx:
    image: nginx:alpine
    container_name: terrasense-gateway
    ports:
      - "80:80" # Exposes NGINX to your local browser
    volumes:
      # Maps your local nginx.conf to the container's configuration folder
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redis_data: