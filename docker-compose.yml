services:
  # 1. The Official PostGIS Storage Node
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: terrasense-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=terrasense
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=terrasense_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. PgBouncer (Connection Pooling)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: terrasense-pgbouncer
    depends_on:
      - db
    ports:
      - "6432:6432"
    environment:
      - DATABASE_URL=postgres://terrasense:secretpassword@db:5432/terrasense_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20

  # 3. Message Broker & Cache
  rabbitmq:
    image: rabbitmq:3-management
    container_name: terrasense-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:alpine
    container_name: terrasense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 4. FastAPI Server
  api:
    build: .
    container_name: terrasense-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      db:
        condition: service_started
      pgbouncer:
        condition: service_started
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
      # Reads bypass the queue and go directly to the database
      - DATABASE_READ_URL=postgresql://terrasense:secretpassword@db:5432/terrasense_db
      # Writes queue up safely inside PgBouncer
      - DATABASE_WRITE_URL=postgresql://terrasense:secretpassword@pgbouncer:6432/terrasense_db
    volumes:
      - ./gee_keys:/root/.config/earthengine:ro

  # 5. Celery ML Worker
  worker:
    build: .
    container_name: terrasense-worker
    command: celery -A services.worker.celery_app worker --pool=solo --loglevel=info
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      pgbouncer:
        condition: service_started
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
      # Heavy ML writes queue up safely inside PgBouncer
      - DATABASE_WRITE_URL=postgresql://terrasense:secretpassword@pgbouncer:6432/terrasense_db
    volumes:
      - ./gee_keys:/root/.config/earthengine:ro

volumes:
  pgdata:
  redis_data: